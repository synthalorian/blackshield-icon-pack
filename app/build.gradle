plugins {
    id 'com.android.application'
}

android {
    namespace 'com.synthclaw.blackshieldicons'
    compileSdk 35

    defaultConfig {
        applicationId 'com.synthclaw.blackshieldicons'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    flavorDimensions 'livery'
    productFlavors {
        bone {
            dimension 'livery'
            // canon: bone glyphs, blood dash — main/res
        }
        red {
            dimension 'livery'
            applicationIdSuffix '.red'
            // canon swap: blood glyphs, bone dash — src/red/res
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
