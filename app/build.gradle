plugins {
    id 'com.android.application'
}

// Upload signing — creds live OUTSIDE the repo in ~/.keystores/ (chmod 600).
def credsFile = new File(System.getProperty('user.home'), '.keystores/blackshield-upload.creds')
def creds = new Properties()
if (credsFile.exists()) {
    credsFile.eachLine { line ->
        def i = line.indexOf('=')
        if (i > 0) creds.setProperty(line.substring(0, i).trim(), line.substring(i + 1).trim())
    }
}

android {
    namespace 'com.synthclaw.blackshieldicons'
    compileSdk 35

    signingConfigs {
        release {
            if (credsFile.exists()) {
                storeFile file(creds.getProperty('storeFile'))
                keyAlias creds.getProperty('keyAlias')
                storePassword creds.getProperty('storePassword')
                keyPassword creds.getProperty('keyPassword')
            }
        }
    }

    defaultConfig {
        applicationId 'com.synthclaw.blackshieldicons'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    flavorDimensions 'livery'
    productFlavors {
        bone {
            dimension 'livery'
            // canon: bone glyphs, blood dash — main/res
        }
        red {
            dimension 'livery'
            applicationIdSuffix '.red'
            // canon swap: blood glyphs, bone dash — src/red/res
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (credsFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
